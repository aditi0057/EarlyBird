name: Job Monitor

# Finds new roles and sends tap-to-approve alerts to your phone.
# Times are UTC. 02:30 UTC = 08:00 IST, 12:30 UTC = 18:00 IST.
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Shared with the approvals workflow so state files never get written at the
# same time (avoids git push conflicts).
concurrency:
  group: job-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to commit updated state back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore real resume from secret
        env:
          RESUME_MD: ${{ secrets.RESUME_MD }}
        run: python -c "import os;open('resume.md','w',encoding='utf-8').write(os.environ.get('RESUME_MD',''))"

      - name: Run monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APPROVE_TOPIC: ${{ secrets.APPROVE_TOPIC }}
          RESUME_LINK: ${{ secrets.RESUME_LINK }}
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          SCHOOL: ${{ secrets.SCHOOL }}
        run: python fetch_jobs.py

      - name: Persist state
        run: |
          git config user.name "job-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f resume.md
          git add seen_jobs.json pending.json approve_state.json || true
          git commit -m "state: monitor [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"
